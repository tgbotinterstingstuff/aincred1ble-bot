# Конфигурация бота. Можно править без изменения кода.
#
# Канал «Супер фичи ИИ» — фичи и лайфхаки Claude для intermediate-юзеров.
# Целевая аудитория: non-dev-мейкеры, которые уже сами собирают свои
# проекты через Claude (типичный читатель — владелец онлайн-магазина по
# продаже автомобилей, который сам сделал свой сайт через Claude).
#
# После пивота единственный включённый источник — YouTube. Остальные
# выключены, потому что для нашей ниши YouTube даёт лучший сигнал
# (туториалы, разборы кейсов, подборки лайфхаков).

# Сколько постов публиковать за один запуск (берёт топ-N по скору крутости)
posts_per_run: 1

# Минимальный балл крутости (0-10), ниже которого пост отбрасывается.
# 6 = пропускаем материалы с конкретными фичами/приёмами Claude.
# Снижено с 7, потому что больше нет жёсткого требования «бизнес-цифры».
min_score: 6

# Сколько кандидатов отдавать в LLM на скоринг за один запуск.
max_candidates_to_score: 20

# Сколько последних дней считаем "свежим".
# Поднял до 5, потому что хороших туториальных видео реже по 1 в день.
freshness_days: 5

# ─────────────────────────────────────────────────────────────────────
# RSS-источники — ОТКЛЮЧЕНЫ после пивота
# Канал теперь про практические фичи Claude, а не про новости/блоги.
# ─────────────────────────────────────────────────────────────────────

rss_feeds:
  enabled: false
  feeds: []

reddit:
  enabled: false
  user_agent: "ai-cases-bot/1.0 (by /u/anonymous)"
  subreddits: []
  min_score: 100
  top_n: 10

hackernews:
  enabled: false
  min_score: 100
  keywords: [AI, LLM, GPT, Claude, Gemini, agent, model, neural, prompt]

# ─────────────────────────────────────────────────────────────────────
# YouTube — главный (и единственный) источник
# Подборка каналов с регулярным intermediate-контентом про Claude:
# Claude Code, sub-agents, MCP, skills, Cowork, Computer Use, Artifacts.
# ─────────────────────────────────────────────────────────────────────

youtube:
  enabled: true
  channels:
    # Официальный канал Anthropic — релизы и демо новых фич Claude
    - name: Claude (Anthropic)
      handle: "@claude"

    # IndyDevDan — глубокие разборы Claude Code, sub-agents, MCP, agentic-воркфлоу
    - name: IndyDevDan
      handle: "@indydevdan"

    # AI Jason — прикладные туториалы по Claude и AI-кодингу
    - name: AI Jason
      handle: "@AIJasonZ"

    # Cole Medin — AI-агенты, n8n + Claude, MCP-серверы
    - name: Cole Medin
      handle: "@ColeMedin"

    # Greg Isenberg — vibe-coding, продукты соло-фаундеров на Claude
    - name: Greg Isenberg
      handle: "@GregIsenberg"

    # Riley Brown — non-dev мейкер, собирает сайты и приложения через Claude/AI
    - name: Riley Brown
      handle: "@rileybrownai"

  # Чуть больше видео на канал — туториальный контент выходит реже,
  # хочется видеть больше окно за 5 дней.
  max_videos_per_channel: 4

# ─────────────────────────────────────────────────────────────────────
# Остальные источники — отключены после пивота
# ─────────────────────────────────────────────────────────────────────

arxiv:
  enabled: false
  categories: [cs.AI, cs.CL, cs.LG]
  max_results: 10
  keywords: [application, system, framework, agent, real-world, deploy, production]

habr:
  enabled: false
  hub: artificial_intelligence
  min_rating: 20

github_trending:
  enabled: false
  language: python
  since: daily
  topics: [llm, ai, agent, ml, gpt, claude]

# Настройки публикации
telegram:
  parse_mode: HTML
  link_preview: true
