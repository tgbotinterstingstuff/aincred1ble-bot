name: Publish AI Cases

on:
  schedule:
    # Каждые 8 часов (в 06:00, 14:00, 22:00 UTC)
    # Поменяй на свой график при желании. Минимум 15 минут на free tier.
    - cron: "0 6,14,22 * * *"
  workflow_dispatch:  # позволяет запускать вручную из вкладки Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # чтобы коммитить обновлённую базу published.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      - name: Commit updated published.db
        run: |
          if [ -n "$(git status --porcelain published.db)" ]; then
            git config user.name "ai-cases-bot"
            git config user.email "bot@users.noreply.github.com"
            git add published.db
            git commit -m "chore: update published.db [skip ci]"
            git push
          else
            echo "Нет изменений в published.db"
          fi
